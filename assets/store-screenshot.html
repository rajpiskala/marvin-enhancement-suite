<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marvin Enhancement Suite store screenshot</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 800px; margin: 0; overflow: hidden; }
      body {
        display: grid;
        grid-template-columns: 1fr 472px;
        gap: 58px;
        align-items: center;
        padding: 54px 70px;
        background:
          radial-gradient(circle at 8% 5%, rgb(255 255 255 / 15%), transparent 28%),
          radial-gradient(circle at 96% 94%, rgb(247 218 136 / 24%), transparent 34%),
          linear-gradient(140deg, #075d63, #0c8c93 56%, #1cc5cb);
        color: #fff;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      .copy { align-self: center; }
      .eyebrow { margin: 0 0 16px; color: #baf5f7; font-size: 18px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { max-width: 590px; margin: 0; font-size: 66px; line-height: 1.02; letter-spacing: -.045em; }
      .lede { max-width: 560px; margin: 26px 0 30px; color: #e5ffff; font-size: 25px; line-height: 1.38; }
      .pills { display: flex; flex-wrap: wrap; gap: 11px; }
      .pill { border: 1px solid rgb(255 255 255 / 35%); border-radius: 999px; padding: 9px 14px; background: rgb(255 255 255 / 11%); font-size: 16px; font-weight: 650; }
      .panel-shell { position: relative; width: 420px; height: 692px; border-radius: 24px; padding: 20px; background: #eef8f9; box-shadow: 0 28px 70px rgb(2 47 50 / 42%); }
      .browser-bar { display: flex; gap: 7px; height: 22px; align-items: flex-start; }
      .browser-bar span { width: 9px; height: 9px; border-radius: 50%; background: #b8d1d4; }
      iframe { display: block; width: 380px; height: 632px; border: 0; border-radius: 13px; background: #fff; }
    </style>
  </head>
  <body>
    <section class="copy">
      <p class="eyebrow">Marvin Enhancement Suite</p>
      <h1>Five small fixes. One calm popup.</h1>
      <p class="lede">Clean up stubborn Amazing Marvin bugs and turn on workflow tools only when you want them.</p>
      <div class="pills">
        <span class="pill">Every module is optional</span>
        <span class="pill">No browser restart</span>
        <span class="pill">No analytics</span>
      </div>
    </section>
    <div class="panel-shell">
      <div class="browser-bar" aria-hidden="true"><span></span><span></span><span></span></div>
      <iframe title="Expanded Marvin Enhancement Suite popup" src="/popup.html?screenshot=1"></iframe>
    </div>
    <script>
      const frame = document.querySelector("iframe");
      frame.addEventListener("load", () => {
        const button = frame.contentDocument.getElementById("options-toggle");
        if (button?.getAttribute("aria-expanded") !== "true") button?.click();
      });
    </script>
  </body>
</html>
