name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit production and release dependencies
        run: npm audit --audit-level=high

      - name: Test and verify release packages
        run: npm run release
